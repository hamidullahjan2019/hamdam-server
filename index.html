<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B54A68"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hamdam"></head><body>
<title>Hamdam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width app column (centered card on desktop). Top bar, scrolling view, bottom tabs. Sheets, chat and onboarding slide over the column. Identity: pomegranate and lapis, faceless illustrated portraits, no real photos. */
:root {
  --bg: #FBF8F7; --surface: #FFFFFF; --ink: #2E2630; --muted: #7B707D; --line: #EBE0E1;
  --wine: #B54A68; --on-wine: #FFFFFF; --lapis: #357886; --gold: #A97F2E; --ok: #3F8F6B; --warn: #BF6B3A;
  --chip: #F3EAEB; --shadow: 0 14px 34px rgba(96, 60, 80, .13); --shadow-sm: 0 3px 12px rgba(96, 60, 80, .08);
  --f-ui: 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif;
  --f-display: 'Noto Kufi Arabic', 'Noto Sans Arabic', 'Tahoma', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1722; --surface: #26202E; --ink: #F1E9F0; --muted: #B7ABBA; --line: #3A3043;
    --wine: #E88CA4; --on-wine: #2A1119; --lapis: #7CC3CF; --gold: #E0BE74; --ok: #74CBA0; --warn: #EEA06F;
    --chip: #322A3B; --shadow: 0 14px 34px rgba(0, 0, 0, .42); --shadow-sm: 0 3px 12px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1722; --surface: #26202E; --ink: #F1E9F0; --muted: #B7ABBA; --line: #3A3043;
  --wine: #E88CA4; --on-wine: #2A1119; --lapis: #7CC3CF; --gold: #E0BE74; --ok: #74CBA0; --warn: #EEA06F;
  --chip: #322A3B; --shadow: 0 14px 34px rgba(0, 0, 0, .42); --shadow-sm: 0 3px 12px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overflow: hidden;
  background-image: radial-gradient(520px 320px at 0% 0%, color-mix(in srgb, var(--wine) 10%, transparent), transparent 70%), radial-gradient(520px 360px at 100% 100%, color-mix(in srgb, var(--lapis) 10%, transparent), transparent 70%);
  background-repeat: no-repeat;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .pcard:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 700px) {
  body { padding-block: 16px; }
  #app { border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow); background: var(--bg); padding-inline: 16px; }
  .layer, .onb { padding-inline: 16px; }
}
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 6px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--wine); }
.logo svg { width: 30px; height: 30px; }
.logo img { width: 30px; height: 30px; object-fit: contain; }
.welcome img.big { object-fit: contain; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
h2.t { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 6px 0 10px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--chip); border-radius: 16px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 11px; padding: 8px 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--wine); box-shadow: var(--shadow-sm); }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-sm); padding: 6px; gap: 4px; margin-block: 4px 8px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 2px; border-radius: 14px; }
.tab[aria-current="page"] { color: var(--wine); background: color-mix(in srgb, var(--wine) 12%, var(--surface)); }
.dot { position: absolute; top: 4px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--wine); color: var(--on-wine); font-size: 11px; line-height: 17px; text-align: center; }

/* portraits */
.art { position: absolute; inset: 0; }
.art svg { width: 100%; height: 100%; display: block; }
.art.blur svg, .art.blur img { filter: blur(16px); transform: scale(1.12); }
.art img { width: 100%; height: 100%; display: block; object-fit: cover; }
.lockmark { position: absolute; top: 50%; inset-inline: 0; text-align: center; transform: translateY(-50%); color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 6px rgba(0,0,0,.5); display: grid; justify-items: center; gap: 6px; }
.lockmark svg { width: 34px; height: 34px; }
.ph .lockmark span { display: none; }
.ph .lockmark svg { width: 20px; height: 20px; }

/* discover */
.filters-row { display: flex; gap: 8px; align-items: center; }
.filters-row .seg { flex: 1; }
#deckwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .stack { position: relative; flex: 1; min-height: 0; margin-block: 10px; }
.pcard { position: absolute; inset: 0; border-radius: 30px; overflow: hidden; background: var(--chip); box-shadow: var(--shadow); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; transition: transform .28s ease, opacity .28s ease; }
.pcard.back { transform: scale(.94) translateY(12px); pointer-events: none; opacity: .85; }
.pinfo { position: absolute; inset-inline: 0; bottom: 0; padding: 80px 20px 20px; background: linear-gradient(transparent, rgba(46, 26, 48, .5) 38%, rgba(40, 22, 44, .86)); color: #fff; }
.pname { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.4; }
.pmeta { font-size: 14px; opacity: .92; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--chip); color: var(--ink); }
.pcard .chip { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(6px); }
.chip.hi { background: color-mix(in srgb, var(--wine) 18%, var(--surface)); color: var(--wine); }
.compat { position: absolute; top: 14px; inset-inline-start: 14px; background: rgba(255,255,255,.86); color: #3A2A3E; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(60,30,60,.18); }
.online { position: absolute; top: 20px; inset-inline-end: 18px; width: 11px; height: 11px; border-radius: 50%; background: #3DDC97; box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
.stamp { position: absolute; top: 60px; padding: 4px 14px; border: 3px solid; border-radius: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; opacity: 0; transform: rotate(-10deg); background: rgba(0,0,0,.25); }
.stamp.yes { inset-inline-start: 18px; color: #6BE8B0; border-color: #6BE8B0; }
.stamp.no { inset-inline-end: 18px; color: #FF8FA6; border-color: #FF8FA6; }
.vbadge { width: 20px; height: 20px; border-radius: 50%; background: var(--lapis); color: #fff; display: inline-grid; place-items: center; flex: none; }
.vbadge svg { width: 13px; height: 13px; stroke-width: 3; }
.actions { display: flex; justify-content: center; align-items: center; gap: 14px; padding-bottom: 8px; }
.act { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.act.sm { width: 46px; height: 46px; }
.act.like { background: var(--wine); color: var(--on-wine); border-color: transparent; width: 68px; height: 68px; box-shadow: 0 10px 24px color-mix(in srgb, var(--wine) 38%, transparent); }
.act.pass { color: var(--muted); }
.act.sup { color: var(--lapis); }
.act.rew { color: var(--gold); }
.empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; color: var(--muted); padding: 24px; }
.empty b { font-family: var(--f-display); font-size: 19px; color: var(--ink); }

/* buttons */
.btn { border: 0; border-radius: 16px; padding: 13px 18px; font-weight: 800; font-size: 16px; background: var(--wine); color: var(--on-wine); box-shadow: 0 6px 16px color-mix(in srgb, var(--wine) 26%, transparent); }
.btn.alt, .btn.ghost, .btn[disabled] { box-shadow: none; }
.btn.alt { background: var(--chip); color: var(--ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

/* likes */
.hrow { display: flex; gap: 12px; overflow-x: auto; padding-block: 4px 10px; scrollbar-width: none; }
.hrow::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 74px; text-align: center; background: transparent; border: 0; font-size: 12.5px; font-weight: 700; }
.mini .ph { position: relative; width: 68px; height: 68px; border-radius: 50%; overflow: hidden; margin: 0 auto 4px; border: 3px solid var(--wine); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard { position: relative; aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden; border: 0; padding: 0; background: var(--chip); text-align: start; }
.gcard .pinfo { padding: 40px 12px 12px; }
.gcard .pname { font-size: 16px; }

/* chat list */
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: start; }
.crow .ph { position: relative; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; flex: none; }
.crow .tx { flex: 1; min-width: 0; }
.crow .nm { font-weight: 800; display: flex; gap: 6px; align-items: center; }
.crow .pv { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread { width: 10px; height: 10px; border-radius: 50%; background: var(--wine); flex: none; }
.left { font-size: 12px; color: var(--warn); font-weight: 700; }

/* overlays */
.layer { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 30; animation: slideIn .25s ease; }
@keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet { position: absolute; inset: 0; z-index: 55; }
.sheet-bg { position: absolute; inset: 0; background: rgba(10, 4, 12, .55); animation: fade .2s ease; }
.sheet-panel { position: absolute; inset-inline: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 8px 16px 20px; box-shadow: 0 -10px 40px rgba(0,0,0,.3); animation: up .28s cubic-bezier(.2,.8,.2,1); }
.sheet-panel.full { height: 92%; padding: 0 0 20px; }
.grip { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 12px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet-panel h3 { font-family: var(--f-display); font-size: 18px; margin: 4px 0 10px; }

/* profile detail */
.hero { position: relative; height: 340px; border-radius: 26px 26px 0 0; overflow: hidden; }
.pbody { padding: 14px 16px 0; display: grid; gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 15px; box-shadow: var(--shadow-sm); }
.box h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.box p { margin: 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kv div span { display: block; font-size: 12px; color: var(--muted); }
.kv div b { font-size: 14.5px; }
.why { display: grid; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.why li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.why svg { color: var(--ok); width: 18px; height: 18px; margin-top: 4px; }
.meter { height: 9px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--lapis), var(--wine)); border-radius: 99px; }
.backbtn { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 3; background: rgba(20,8,22,.55); color: #fff; border: 0; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.sticky-act { display: flex; gap: 10px; padding: 12px 16px 0; }

/* chat */
.chead { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.chead .ph { position: relative; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; }
.chead .nm { flex: 1; min-width: 0; font-weight: 800; line-height: 1.3; }
.chead .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 12px; }
.bub { max-width: 80%; padding: 9px 13px; border-radius: 18px; word-wrap: break-word; overflow-wrap: anywhere; }
.bub.me { align-self: flex-start; background: color-mix(in srgb, var(--wine) 88%, #fff); color: var(--on-wine); border-end-start-radius: 5px; }
.bub.them { align-self: flex-end; background: var(--surface); border: 1px solid var(--line); border-end-end-radius: 5px; }
.bub small { display: block; font-size: 11px; opacity: .7; margin-top: 2px; }
.sysmsg { align-self: center; text-align: center; font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 12px; padding: 6px 12px; max-width: 92%; }
.voice { display: flex; align-items: center; gap: 8px; }
.wave { display: flex; align-items: center; gap: 2px; height: 22px; }
.wave i { width: 3px; border-radius: 2px; background: currentColor; opacity: .75; }
.banner { display: flex; gap: 8px; align-items: flex-start; background: color-mix(in srgb, var(--lapis) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--lapis) 30%, var(--line)); border-radius: 14px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.banner button { border: 0; background: transparent; font-weight: 800; color: var(--wine); padding: 0 6px; }
.ice { display: flex; gap: 8px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
.ice::-webkit-scrollbar { display: none; }
.ice button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.compose { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.compose input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 11px 16px; font: inherit; }
.typing { align-self: flex-end; color: var(--muted); font-size: 13px; padding: 2px 8px; }

/* forms */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .lbl { font-weight: 700; font-size: 14px; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: inherit; min-width: 0; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice.three { grid-template-columns: 1fr; }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px; text-align: start; font-weight: 700; }
.pick small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.pick[aria-pressed="true"] { border-color: var(--wine); background: color-mix(in srgb, var(--wine) 9%, var(--surface)); }
.tagrow { display: flex; flex-wrap: wrap; gap: 8px; }
.tagrow button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.tagrow button[aria-pressed="true"] { border-color: var(--wine); background: var(--wine); color: var(--on-wine); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.setrow .tx { flex: 1; min-width: 0; }
.setrow .tx b { display: block; }
.setrow .tx small { color: var(--muted); font-size: 12.5px; line-height: 1.5; display: block; }
.sw { position: relative; width: 48px; height: 28px; border-radius: 99px; border: 0; background: var(--line); flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s ease; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { inset-inline-start: 23px; }
.linkrow { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: transparent; padding: 13px 2px; border-bottom: 1px solid var(--line); font-weight: 700; text-align: start; }
.meprof { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px; box-shadow: var(--shadow-sm); }
.meprof .ph { position: relative; width: 78px; height: 78px; border-radius: 50%; overflow: hidden; flex: none; border: 3px solid var(--wine); }
.vstate { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--chip); }
.vstate.ok { background: color-mix(in srgb, var(--lapis) 16%, var(--surface)); color: var(--lapis); }
.goldcard { border-radius: 22px; padding: 16px; color: #3a2a08; background: linear-gradient(135deg, #F6E8C2, #E8CC8A); display: grid; gap: 4px; box-shadow: var(--shadow-sm); }
.goldcard b { font-family: var(--f-display); font-size: 17px; }

/* onboarding + match */
.onb { position: absolute; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-block: 12px 16px; }
.onb .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.dots { display: flex; gap: 6px; justify-content: center; padding: 6px 0 12px; }
.dots i { width: 22px; height: 5px; border-radius: 99px; background: var(--line); }
.dots i.on { background: var(--wine); }
.welcome { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 6vh 0 8px; background: radial-gradient(260px 200px at 50% 12%, color-mix(in srgb, var(--wine) 14%, transparent), transparent 70%); }
.welcome .big { width: 96px; height: 96px; }
.welcome h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; margin: 0; color: var(--wine); }
.welcome p { margin: 0; color: var(--muted); max-width: 30ch; }
.feat { display: grid; gap: 8px; text-align: start; width: 100%; margin-top: 4px; }
.feat div { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px; font-size: 14px; box-shadow: var(--shadow-sm); }
.feat svg { color: var(--wine); margin-top: 3px; }
.match { position: absolute; inset: 0; z-index: 60; display: grid; place-content: center; justify-items: center; gap: 16px; text-align: center; padding: 24px; background: radial-gradient(420px 300px at 50% 28%, rgba(232,140,164,.38), transparent 70%), linear-gradient(165deg, #3C2A48, #2B2036); color: #fff; animation: fade .25s ease; }
.match h2 { font-family: var(--f-display); font-weight: 800; font-size: 32px; margin: 0; color: #FFB3C9; }
.match .pair { display: flex; align-items: center; }
.match .pair .ph { position: relative; width: 112px; height: 112px; border-radius: 50%; overflow: hidden; border: 4px solid #fff; }
.match .pair .ph + .ph { margin-inline-start: -22px; }
.match .btn.alt { background: rgba(255,255,255,.14); color: #fff; }
